services:
  - type: web
    name: chinese-drill-bot
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/bot.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: TOPIC_WORK_THRESHOLD
        value: "20"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBAPP_URL
        value: https://chinese-drill-app.onrender.com/

  - type: web
    name: chinese-drill-app
    runtime: static
    buildCommand: node scripts/build-webapp.mjs
    staticPublishPath: webapp
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
