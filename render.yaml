services:
  - type: web
    name: chinese-drill-bot
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/bot.js
    # Бот пересобирается только при изменении кода: правки колод его не перезапускают
    # (при старте он берёт свежие колоды с сайта). Так на бесплатном тарифе не расходуются
    # минуты сборки.
    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
        - tsconfig.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBAPP_URL
        value: https://chinese-drill-app.onrender.com/

  - type: web
    name: chinese-drill-app
    runtime: static
    buildCommand: npm ci --include=dev && node scripts/build-webapp.mjs
    staticPublishPath: webapp
    buildFilter:
      paths:
        - webapp/**
        - data/decks/**
        - scripts/build-webapp.mjs
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
