# Пример nginx перед ботом на VM (нужен только для вебхука).
# Главное: журнал доступа выключен, IP-адреса посетителей на диск не пишутся.
# Бот слушает порт PORT (по умолчанию 8080). Положить в /etc/nginx/conf.d/chinese-drill-bot.conf, домен и сертификат подставить свои.

server {
    listen 443 ssl;
    server_name example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    # Никаких журналов запросов. В журнал ошибок попадает адрес клиента, поэтому он
    # отправляется в никуда; при отладке можно временно вернуть /var/log/nginx/error.log.
    access_log off;
    error_log  /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Адрес клиента дальше не передаём: боту он не нужен.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }
}
