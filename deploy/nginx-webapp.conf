# Тренажёр как статика внутри контейнера. Снаружи перед ним стоит свой веб-сервер
# с HTTPS; этот слушает только сеть Docker.
# Журнал доступа выключен: адреса посетителей на диск не пишутся.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Черты иероглифов и библиотека меняются только вместе со сборкой.
    location ~ ^/(strokes|vendor)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Страница, код и колоды — всегда свежие: колоды правятся без пересборки бота.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
}
